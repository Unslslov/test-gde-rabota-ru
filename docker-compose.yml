services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: mylaravel/php82-app
    container_name: app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - './:/var/www/html'
      - './docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro'
    env_file:
      - .env
    networks:
      - app-network
  web:
    image: 'nginx:latest'
    container_name: web
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - './:/var/www/html:ro'
      - './docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - app-network
  mysql:
    image: 'mysql:8.0'
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-laravel}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'mysqldata:/var/lib/mysql'
    ports:
      - '3306:3306'
    networks:
      - app-network
  manticore:
    image: manticoresearch/manticore:latest
    container_name: manticore
    restart: unless-stopped
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - './docker/manticore/manticore.conf:/etc/manticoresearch/manticore.conf'
      - manticoredata:/var/lib/manticore
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysqldata: null
  manticoredata:

networks:
  app-network:
    driver: bridge
